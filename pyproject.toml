[project]
name = "dti"
version = "0.1.0"
description = "Detection and tracking of tiny insects with a DVS and an RGB camera (master thesis code)"
requires-python = ">=3.11"
dependencies = ["numpy", "opencv-python", "scipy", "h5py"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
